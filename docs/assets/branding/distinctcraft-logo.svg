<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title description">
  <title id="title">DistinctCraft logo</title>
  <desc id="description">Nox presents two ore blocks: one difficult to distinguish and one made clear by a strong geometric pattern.</desc>
  <defs>
    <linearGradient id="background" x1="70" y1="44" x2="442" y2="474" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F5EAD7"/>
    </linearGradient>
    <linearGradient id="skin" x1="173" y1="111" x2="340" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8AD83"/>
      <stop offset="1" stop-color="#C98257"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="179" y1="278" x2="329" y2="458" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#242B39"/>
      <stop offset="1" stop-color="#151B26"/>
    </linearGradient>
    <linearGradient id="clearFace" x1="290" y1="345" x2="397" y2="444" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E8ECE8"/>
      <stop offset="1" stop-color="#AAB4B0"/>
    </linearGradient>
    <filter id="shadow" x="22" y="18" width="468" height="484" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="11" flood-color="#382B20" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#background)"/>
  <rect x="27" y="27" width="458" height="458" rx="97" fill="none" stroke="#D5C5AB" stroke-opacity="0.56" stroke-width="6"/>
  <g filter="url(#shadow)">
    <!-- Nox, interpreted as an original vector character from the MCPlayerTwo skin. -->
    <path d="M165 116 191 89H322L349 116V258L322 288H190L162 258V116Z" fill="url(#skin)" stroke="#553523" stroke-width="8" stroke-linejoin="round"/>
    <path d="M163 117 191 89H322L349 116V157H323V139H294V158H260V132H227V153H196V170H162V117Z" fill="#3B251A"/>
    <path d="M191 89H322L349 116H302L281 105 258 123 231 104 207 123 163 117 191 89Z" fill="#5A351F"/>
    <path d="M162 156H184V223H162V156ZM327 156H349V223H327V156Z" fill="#6D412A" opacity="0.70"/>

    <!-- Matching blue eyes keep Nox friendly and readable at icon size. -->
    <rect x="196" y="177" width="48" height="36" rx="8" fill="#FFFDF7" stroke="#4B3024" stroke-width="6"/>
    <rect x="267" y="177" width="48" height="36" rx="8" fill="#FFFDF7" stroke="#4B3024" stroke-width="6"/>
    <rect x="216" y="184" width="15" height="23" rx="3" fill="#6BA6C0"/>
    <rect x="279" y="184" width="15" height="23" rx="3" fill="#6BA6C0"/>
    <rect x="221" y="187" width="5" height="7" rx="2" fill="#21323B"/>
    <rect x="284" y="187" width="5" height="7" rx="2" fill="#21323B"/>

    <!-- Pixel-like beard and friendly smile. -->
    <path d="M183 220V255L207 279H305L329 255V220H310V245L292 265H220L201 245V220H183Z" fill="#5B3521" opacity="0.92"/>
    <path d="M224 239C241 251 270 251 287 239" fill="none" stroke="#F1B184" stroke-width="7" stroke-linecap="round"/>

    <!-- Dark hoodie with blue sleeves and the small amber zipper from the skin. -->
    <path d="M188 283H323L355 316V449H157V316L188 283Z" fill="url(#hoodie)" stroke="#19212D" stroke-width="8" stroke-linejoin="round"/>
    <path d="M188 284 157 316V425H191V329L218 284H188ZM323 284 355 316V425H321V329L294 284H323Z" fill="#526F92"/>
    <path d="M216 284 256 324 296 284" fill="none" stroke="#111722" stroke-width="10" stroke-linejoin="round"/>
    <path d="M256 321V390" stroke="#354154" stroke-width="7"/>
    <rect x="251" y="336" width="10" height="25" rx="3" fill="#F4C64F"/>

    <!-- Left: a deliberately ambiguous, low-contrast ore block. -->
    <path d="M91 351 145 321 208 348 151 381 91 351Z" fill="#A7ADAA" stroke="#344040" stroke-width="7" stroke-linejoin="round"/>
    <path d="M91 351 151 381V451L91 418V351Z" fill="#858D8A" stroke="#344040" stroke-width="7" stroke-linejoin="round"/>
    <path d="M208 348 151 381V451L208 418V348Z" fill="#747D7A" stroke="#344040" stroke-width="7" stroke-linejoin="round"/>
    <g fill="#949B98">
      <rect x="107" y="365" width="11" height="10" rx="2"/>
      <rect x="126" y="389" width="12" height="11" rx="2"/>
      <rect x="106" y="405" width="10" height="10" rx="2"/>
      <rect x="163" y="374" width="12" height="11" rx="2"/>
      <rect x="181" y="391" width="10" height="10" rx="2"/>
    </g>

    <!-- Amber transformation cue: DistinctCraft turns similarity into legible structure. -->
    <path d="M222 378H264V360L292 388 264 416V398H222Z" fill="#F4C64F" stroke="#263334" stroke-width="7" stroke-linejoin="round"/>

    <!-- Right: the same material language made distinct by contrast and geometry. -->
    <path d="M304 348 363 317 424 348 364 381 304 348Z" fill="#F1F3EF" stroke="#263334" stroke-width="7" stroke-linejoin="round"/>
    <path d="M304 348 364 381V451L304 418V348Z" fill="url(#clearFace)" stroke="#263334" stroke-width="7" stroke-linejoin="round"/>
    <path d="M424 348 364 381V451L424 418V348Z" fill="#455353" stroke="#263334" stroke-width="7" stroke-linejoin="round"/>
    <path d="M335 340 363 325 391 340 363 356 335 340Z" fill="#F4C64F" stroke="#263334" stroke-width="6" stroke-linejoin="round"/>
    <path d="M350 340 363 333 376 340 363 348 350 340Z" fill="#263334"/>

    <!-- Hands connect Nox to both examples without hiding their patterns. -->
    <path d="M145 323 165 310 184 342 161 355 145 323Z" fill="#D98E62" stroke="#553523" stroke-width="7" stroke-linejoin="round"/>
    <path d="M367 320 347 308 329 340 352 353 367 320Z" fill="#D98E62" stroke="#553523" stroke-width="7" stroke-linejoin="round"/>
  </g>
</svg>
