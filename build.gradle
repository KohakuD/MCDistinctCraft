plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.register('validateBaselineResources') {
    group = 'verification'
    description = 'Validates the shared baseline resources and locale parity.'

    def textureDirectory = layout.projectDirectory.dir('src/main/resources/assets/minecraft/textures/block')
    def forbiddenTextureOverrides = ['stone.png', 'andesite.png', 'gravel.png', 'iron_ore.png', 'coal_ore.png']
    def localeDirectory = layout.projectDirectory.dir('src/main/resources/assets/distinctcraft/lang')
    def requiredLocales = ['en_us.json', 'de_de.json', 'nl_nl.json']
    def smokeTestFile = layout.projectDirectory.file('src/main/resources/data/distinctcraft/function/baseline_smoke_test.mcfunction')

    inputs.files(requiredLocales.collect { localeDirectory.file(it) })
    inputs.file(smokeTestFile)

    doLast {
        forbiddenTextureOverrides.each { textureName ->
            def textureFile = textureDirectory.file(textureName).asFile
            if (textureFile.exists()) {
                throw new GradleException("Profile texture must not leak into the always-active mod resources: ${textureFile}")
            }
        }

        if (!smokeTestFile.asFile.isFile()) {
            throw new GradleException("Missing baseline smoke-test function: ${smokeTestFile.asFile}")
        }
        def smokeTest = smokeTestFile.asFile.text
        ['dirt', 'stone', 'andesite', 'gravel', 'iron_ore', 'coal_ore'].each { blockName ->
            if (!smokeTest.contains("minecraft:${blockName}")) {
                throw new GradleException("Smoke-test function does not include minecraft:${blockName}")
            }
        }

        def localeKeys = requiredLocales.collectEntries { localeName ->
            def localeFile = localeDirectory.file(localeName).asFile
            if (!localeFile.isFile()) {
                throw new GradleException("Missing locale: ${localeFile}")
            }
            [(localeName): new groovy.json.JsonSlurper().parse(localeFile).keySet()]
        }
        def expectedKeys = localeKeys[requiredLocales.first()]
        localeKeys.each { localeName, keys ->
            if (keys != expectedKeys) {
                throw new GradleException("Locale key mismatch in ${localeName}: expected ${expectedKeys}, found ${keys}")
            }
        }
    }
}

tasks.register('validateProfileResources') {
    group = 'verification'
    description = 'Validates all bundled 0.2.0 profile packs and texture variants.'

    def profileRoot = layout.projectDirectory.dir('src/main/resources/resourcepacks')
    def profiles = ['subtle', 'clear', 'monochrome']
    def requiredTextures = ['andesite.png', 'gravel.png', 'iron_ore.png', 'coal_ore.png']
    def profileRegistration = layout.projectDirectory.file('src/main/java/ch/minenox/distinctcraft/AccessibilityProfile.java')
    def profileManager = layout.projectDirectory.file('src/main/java/ch/minenox/distinctcraft/ProfileManager.java')
    def profileDocumentation = layout.projectDirectory.file('docs/Profiles.md')

    inputs.dir(profileRoot)
    inputs.files(profileRegistration, profileManager, profileDocumentation)

    doLast {
        def registrationSource = profileRegistration.asFile.text
        def managerSource = profileManager.asFile.text
        def profileDocs = profileDocumentation.asFile.text
        def textureHashes = requiredTextures.collectEntries { [(it): []] }

        if (!managerSource.contains('int profilePackIndex = selectedPacks.size()')
                || !managerSource.contains('selectedPacks.add(Math.min(profilePackIndex, selectedPacks.size()), profile.packId())')) {
            throw new GradleException('Profile switching must preserve the selected DistinctCraft pack priority')
        }
        if (!profileDocs.contains('Priority with other resource packs')) {
            throw new GradleException('Profile documentation must explain third-party resource-pack priority')
        }

        profiles.each { profile ->
            if (!registrationSource.contains("\"${profile}\"")) {
                throw new GradleException("Profile is not registered in AccessibilityProfile.java: ${profile}")
            }

            def profileDirectory = profileRoot.dir(profile)
            def metadataFile = profileDirectory.file('pack.mcmeta').asFile
            if (!metadataFile.isFile()) {
                throw new GradleException("Missing pack metadata for profile ${profile}: ${metadataFile}")
            }

            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            if (metadata.pack?.min_format != [88, 0] || metadata.pack?.max_format != [88, 0]) {
                throw new GradleException("Profile ${profile} must target resource format 88.0")
            }
            if (metadata.pack?.description?.translate != "pack.distinctcraft.profile.${profile}.description") {
                throw new GradleException("Profile ${profile} has an incorrect translated description key")
            }

            requiredTextures.each { textureName ->
                def textureFile = profileDirectory.file("assets/minecraft/textures/block/${textureName}").asFile
                if (!textureFile.isFile()) {
                    throw new GradleException("Missing ${profile} texture: ${textureFile}")
                }

                def image = javax.imageio.ImageIO.read(textureFile)
                if (image == null || image.width != 16 || image.height != 16) {
                    throw new GradleException("Profile texture must be a readable 16 x 16 PNG: ${textureFile}")
                }

                def digest = java.security.MessageDigest.getInstance('SHA-256').digest(textureFile.bytes).encodeHex().toString()
                textureHashes[textureName] << digest
            }

            def stoneOverride = profileDirectory.file('assets/minecraft/textures/block/stone.png').asFile
            if (stoneOverride.exists()) {
                throw new GradleException("Profile ${profile} must preserve vanilla stone: ${stoneOverride}")
            }
        }

        textureHashes.each { textureName, hashes ->
            if (hashes.toSet().size() != profiles.size()) {
                throw new GradleException("Every profile must provide a distinct ${textureName} variant")
            }
        }
    }
}

tasks.register('validateClientUxResources') {
    group = 'verification'
    description = 'Validates the 0.3.0 client UX registration and translated controls.'

    def javaRoot = layout.projectDirectory.dir('src/main/java/ch/minenox/distinctcraft')
    def localeDirectory = layout.projectDirectory.dir('src/main/resources/assets/distinctcraft/lang')
    def requiredLocales = ['en_us.json', 'de_de.json', 'nl_nl.json']
    def requiredSources = [
            'DistinctCraftConfig.java',
            'DistinctCraftConfigScreen.java',
            'DistinctCraftKeyMappings.java',
            'DistinctCraftClientEvents.java',
            'ProfileManager.java'
    ]
    def requiredKeys = [
            'screen.distinctcraft.config.title',
            'config.distinctcraft.profile',
            'config.distinctcraft.target_outline',
            'config.distinctcraft.target_outline.tooltip',
            'key.category.distinctcraft.accessibility',
            'key.distinctcraft.open_settings',
            'key.distinctcraft.cycle_profile',
            'key.distinctcraft.toggle_highlight',
            'message.distinctcraft.profile_changed',
            'message.distinctcraft.highlight_enabled',
            'message.distinctcraft.highlight_disabled'
    ]

    inputs.files(requiredSources.collect { javaRoot.file(it) })
    inputs.files(requiredLocales.collect { localeDirectory.file(it) })

    doLast {
        requiredSources.each { sourceName ->
            if (!javaRoot.file(sourceName).asFile.isFile()) {
                throw new GradleException("Missing 0.3.0 client UX source: ${sourceName}")
            }
        }

        requiredLocales.each { localeName ->
            def locale = new groovy.json.JsonSlurper().parse(localeDirectory.file(localeName).asFile)
            requiredKeys.each { key ->
                if (!locale.containsKey(key) || !locale[key]) {
                    throw new GradleException("Missing translated 0.3.0 key ${key} in ${localeName}")
                }
            }
        }

        def clientEvents = javaRoot.file('DistinctCraftClientEvents.java').asFile.text
        if (!clientEvents.contains('ExtractBlockOutlineRenderStateEvent') || !clientEvents.contains('TARGET_OUTLINE')) {
            throw new GradleException('Target outline must remain optional and restricted to the vanilla looked-at block')
        }
    }
}

tasks.register('validateCoverageResources') {
    group = 'verification'
    description = 'Validates 0.4.0 ore blocks, matching item textures, registry names, and smoke-test coverage.'
    dependsOn tasks.named('createMinecraftArtifacts')

    def profileRoot = layout.projectDirectory.dir('src/main/resources/resourcepacks')
    def coverageManifest = layout.projectDirectory.file('src/main/resources/assets/distinctcraft/coverage/ore_families.json')
    def smokeTestFile = layout.projectDirectory.file('src/main/resources/data/distinctcraft/function/coverage_smoke_test.mcfunction')
    def coverageScreenshot = layout.projectDirectory.file('docs/images/0.4.0-coverage.png')
    def minecraftArtifact = layout.buildDirectory.file("moddev/artifacts/minecraft-patched-${neo_version}.jar")
    def profiles = ['subtle', 'clear', 'monochrome']

    inputs.dir(profileRoot)
    inputs.file(coverageManifest)
    inputs.file(smokeTestFile)
    inputs.file(coverageScreenshot)
    inputs.file(minecraftArtifact)

    doLast {
        def validateImage = { textureFile, requireTransparency, label ->
            if (!textureFile.isFile()) {
                throw new GradleException("Missing ${label} texture: ${textureFile}")
            }
            def image = javax.imageio.ImageIO.read(textureFile)
            if (image == null || image.width != 16 || image.height != 16) {
                throw new GradleException("${label} texture must be a readable 16 x 16 PNG: ${textureFile}")
            }
            if (requireTransparency) {
                def hasTransparentPixel = false
                for (int y = 0; y < image.height; y++) {
                    for (int x = 0; x < image.width; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xFF) == 0) {
                            hasTransparentPixel = true
                            break
                        }
                    }
                    if (hasTransparentPixel) break
                }
                if (!hasTransparentPixel) {
                    throw new GradleException("${label} item texture must retain a transparent background: ${textureFile}")
                }
            }
            else {
                for (int y = 0; y < image.height; y++) {
                    for (int x = 0; x < image.width; x++) {
                        if (((image.getRGB(x, y) >>> 24) & 0xFF) != 255) {
                            throw new GradleException("${label} world texture must remain fully opaque: ${textureFile}")
                        }
                    }
                }
            }
        }
        def digest = { file ->
            java.security.MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
        }

        def manifest = new groovy.json.JsonSlurper().parse(coverageManifest.asFile)
        def families = manifest.families
        if (!(families instanceof List) || families.size() != 10) {
            throw new GradleException('Coverage manifest must define exactly ten ore families')
        }

        def familyIds = families.collect { it.id }
        def blockNames = families.collectMany { it.blocks }
        def itemNames = families.collect { it.item }
        if (familyIds.toSet().size() != familyIds.size()) {
            throw new GradleException('Coverage manifest contains duplicate family ids')
        }
        if (blockNames.size() != 18 || blockNames.toSet().size() != blockNames.size()) {
            throw new GradleException('Coverage manifest must define 18 unique ore blocks')
        }
        if (itemNames.size() != 10 || itemNames.toSet().size() != itemNames.size()) {
            throw new GradleException('Coverage manifest must define ten unique matching items')
        }

        def textureHashes = (blockNames + itemNames).collectEntries { [(it): []] }
        profiles.each { profile ->
            blockNames.each { blockName ->
                def textureFile = profileRoot.file("${profile}/assets/minecraft/textures/block/${blockName}.png").asFile
                validateImage(textureFile, false, "${profile} block ${blockName}")
                textureHashes[blockName] << digest(textureFile)
                if (new File(textureFile.parentFile, textureFile.name + '.mcmeta').exists()) {
                    throw new GradleException("Animated or emissive metadata is not allowed for ore texture: ${textureFile}")
                }
            }
            itemNames.each { itemName ->
                def textureFile = profileRoot.file("${profile}/assets/minecraft/textures/item/${itemName}.png").asFile
                validateImage(textureFile, true, "${profile} item ${itemName}")
                textureHashes[itemName] << digest(textureFile)
            }
        }

        textureHashes.each { textureName, hashes ->
            if (hashes.toSet().size() != profiles.size()) {
                throw new GradleException("Every profile must provide a distinct ${textureName} variant")
            }
        }

        def smokeTest = smokeTestFile.asFile.text
        blockNames.each { blockName ->
            if (!smokeTest.contains("minecraft:${blockName}")) {
                throw new GradleException("Coverage smoke test is missing block minecraft:${blockName}")
            }
        }
        itemNames.each { itemName ->
            if (!smokeTest.contains("give @s minecraft:${itemName}")) {
                throw new GradleException("Coverage smoke test is missing item minecraft:${itemName}")
            }
        }
        if (!smokeTest.contains('minecraft:dirt')) {
            throw new GradleException('Coverage smoke test must retain dirt as a contrast reference')
        }

        def gameJar = minecraftArtifact.get().asFile
        if (!gameJar.isFile()) {
            throw new GradleException("Missing patched Minecraft artifact for registry validation: ${gameJar}")
        }
        def zip = new java.util.zip.ZipFile(gameJar)
        try {
            blockNames.each { blockName ->
                if (zip.getEntry("assets/minecraft/blockstates/${blockName}.json") == null) {
                    throw new GradleException("Unknown Minecraft 26.2 block in coverage manifest: ${blockName}")
                }
            }
            itemNames.each { itemName ->
                if (zip.getEntry("assets/minecraft/items/${itemName}.json") == null) {
                    throw new GradleException("Unknown Minecraft 26.2 item in coverage manifest: ${itemName}")
                }
            }
        }
        finally {
            zip.close()
        }

        def screenshot = javax.imageio.ImageIO.read(coverageScreenshot.asFile)
        if (screenshot == null || screenshot.width < 1000 || screenshot.height < 600) {
            throw new GradleException('0.4.0 coverage contact sheet is missing or too small')
        }
    }
}

tasks.register('validateCompatibilityResources') {
    group = 'verification'
    description = 'Validates the pinned 0.5.0 Jade and WTHIT compatibility-test setup.'

    def manifestFile = layout.projectDirectory.file('tools/compatibility-mods.json')
    def selectorFile = layout.projectDirectory.file('tools/select-compatibility-mod.ps1')
    def verifierFile = layout.projectDirectory.file('tools/verify-compatibility-log.ps1')
    def testNotesFile = layout.projectDirectory.file('docs/testing/0.5.0-compatibility.md')
    def futureExtensionsFile = layout.projectDirectory.file('docs/Future-Extensions.md')
    def modMetadataFile = layout.projectDirectory.file('src/main/templates/META-INF/neoforge.mods.toml')
    def javaRoot = layout.projectDirectory.dir('src/main/java')
    def expectedMinecraftVersion = minecraft_version.toString()
    def expectedNeoForgeVersion = neo_version.toString()

    inputs.files(manifestFile, selectorFile, verifierFile, testNotesFile, futureExtensionsFile, modMetadataFile)
    inputs.dir(javaRoot)

    doLast {
        def manifest = new groovy.json.JsonSlurper().parse(manifestFile.asFile)
        if (manifest.minecraft != expectedMinecraftVersion || manifest.neoforge != expectedNeoForgeVersion) {
            throw new GradleException('Compatibility matrix must match the configured Minecraft and NeoForge versions')
        }
        if (manifest.providers.keySet() as Set != ['jade', 'wthit'] as Set) {
            throw new GradleException('Compatibility matrix must contain exactly Jade and WTHIT')
        }
        if (manifest.providers.jade.version != '26.2.10+neoforge') {
            throw new GradleException('Jade compatibility must remain pinned to 26.2.10+neoforge for 0.5.0')
        }
        if (manifest.providers.wthit.version != 'neo-20.0.0') {
            throw new GradleException('WTHIT compatibility must remain pinned to neo-20.0.0 for 0.5.0')
        }

        def filenames = []
        manifest.providers.each { providerName, provider ->
            if (!provider.modId || !provider.files) {
                throw new GradleException("Incomplete compatibility provider: ${providerName}")
            }
            provider.files.each { file ->
                if (!(file.filename ==~ /[A-Za-z0-9.+_-]+\.jar/)) {
                    throw new GradleException("Unsafe compatibility filename: ${file.filename}")
                }
                if (!file.url.startsWith('https://cdn.modrinth.com/')) {
                    throw new GradleException("Compatibility downloads must use the official Modrinth CDN: ${file.url}")
                }
                if (!(file.sha512 ==~ /[0-9a-f]{128}/)) {
                    throw new GradleException("Invalid SHA-512 for compatibility file: ${file.filename}")
                }
                filenames << file.filename
            }
        }
        if (filenames.size() != filenames.toSet().size()) {
            throw new GradleException('Compatibility filenames must be unique')
        }

        def metadata = modMetadataFile.asFile.text
        ['jade', 'wthit', 'badpackets'].each { modId ->
            if (metadata.contains("modId=\"${modId}\"")) {
                throw new GradleException("Overlay test mod must not become a packaged dependency: ${modId}")
            }
        }

        def forbiddenApiReferences = ['snownee.jade', 'mcp.mobius.waila']
        javaRoot.asFileTree.matching { include '**/*.java' }.files.each { sourceFile ->
            def source = sourceFile.text
            forbiddenApiReferences.each { reference ->
                if (source.contains(reference)) {
                    throw new GradleException("Optional overlay API leaked into production source: ${reference} in ${sourceFile}")
                }
            }
        }

        def selector = selectorFile.asFile.text
        def verifier = verifierFile.asFile.text
        def testNotes = testNotesFile.asFile.text
        def futureExtensions = futureExtensionsFile.asFile.text
        ['jade', 'wthit'].each { providerName ->
            if (!selector.contains(providerName) || !verifier.contains(providerName) || !testNotes.toLowerCase(Locale.ROOT).contains(providerName)) {
                throw new GradleException("Compatibility tooling or documentation is missing provider: ${providerName}")
            }
        }
        if (!testNotes.contains('coverage_smoke_test')) {
            throw new GradleException('Compatibility test notes must retain the coverage smoke test')
        }
        ['Resource add-on', 'Profile parity', 'Runtime adapter only when necessary', 'no world scans', 'no Jade API dependency'].each { requirement ->
            if (!futureExtensions.contains(requirement)) {
                throw new GradleException("Future-extension safety plan is missing: ${requirement}")
            }
        }
    }
}

tasks.named('check').configure {
    dependsOn tasks.named('validateBaselineResources')
    dependsOn tasks.named('validateProfileResources')
    dependsOn tasks.named('validateClientUxResources')
    dependsOn tasks.named('validateCoverageResources')
    dependsOn tasks.named('validateCompatibilityResources')
}

def compatibilitySelector = layout.projectDirectory.file('tools/select-compatibility-mod.ps1').asFile

['Jade': 'jade', 'Wthit': 'wthit'].each { taskSuffix, providerName ->
    tasks.register("use${taskSuffix}Compatibility", Exec) {
        group = 'ide'
        description = "Downloads, verifies, and selects ${providerName} as the exclusive overlay mod for runClient."
        onlyIf { System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') }
        inputs.file(layout.projectDirectory.file('tools/compatibility-mods.json'))
        inputs.file(compatibilitySelector)
        outputs.upToDateWhen { false }
        commandLine 'powershell.exe',
                '-NoProfile',
                '-NonInteractive',
                '-ExecutionPolicy', 'Bypass',
                '-File', compatibilitySelector.absolutePath,
                providerName
    }
}

def windowPositionHelper = layout.projectDirectory.file('tools/position-minecraft-window.ps1').asFile
def windowPositionWorkingDirectory = layout.projectDirectory.asFile

def positionMinecraftWindow = tasks.register('positionMinecraftWindow') {
    group = 'ide'
    description = 'Starts the Windows helper that places the dev client on the left two thirds of the monitor.'
    onlyIf { System.getProperty('os.name').toLowerCase(Locale.ROOT).contains('windows') }
    inputs.file(windowPositionHelper)

    doLast {
        new ProcessBuilder(
                'powershell.exe',
                '-NoProfile',
                '-NonInteractive',
                '-WindowStyle', 'Hidden',
                '-ExecutionPolicy', 'Bypass',
                '-File', windowPositionHelper.absolutePath)
                .directory(windowPositionWorkingDirectory)
                .start()
    }
}

tasks.named('runClient').configure {
    dependsOn positionMinecraftWindow
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
